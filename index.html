            --text-main: #e0e0e0;

        * {

        body {

            color: var(--text-main);

            margin: 0;
            padding: 30px 15px 60px;

            flex-direction: column;

        .container {

        .brand h1 {

        .header-actions {

            align-items: center;

            padding: 6px 12px;
            border-radius: 20px;

            background: #383838;

            border: 1px solid var(--border-color);

            padding: 24px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);

        .player-main-area {

            grid-template-columns: 1fr 1.45fr;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .player-main-area {

            }
        }

        .player-left-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        /* Увеличенное окно обложки трека */
        .cover-art-box {
            width: 140px;
            height: 140px;
            background: #161616;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }

        .cover-art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover-placeholder {
            padding: 8px;
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.3;
            font-weight: 500;
            user-select: none;
        }

        .cover-placeholder span {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 6px;
            color: var(--accent-purple);
        }

        .player-info-right {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .now-playing-info h2 {
            margin: 0 0 6px 0;
            font-size: 1.55rem;
            color: #ffffff;
        }

        .tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 6px;
            background: #2c2c2c;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        /* Правая часть */
        .player-right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
        }

            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 12px 14px;
            height: 140px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 92px;
            gap: 3px;
        }

        .bar {
            flex: 1;
            background: linear-gradient(to top, #ffe600, #ff8800, #cc0000, #660000);
            border-radius: 2px;
            transition: height 0.06s ease;
            min-height: 6px;
        }

        .freq-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: var(--text-muted);
            border-top: 1px solid #282828;
            padding-top: 5px;
            font-variant-numeric: tabular-nums;
            width: 100%;
        }

        /* Окно эквалайзера с кнопкой сброса */
        .eq-box {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 8px 6px;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .eq-sliders-row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex: 1;
        }

        .eq-slider-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            background: #1c1c1c;
            border: 1px solid #282828;
            border-radius: 6px;
            padding: 5px 3px;
        }

        .eq-slider-col span {
            font-size: 0.6rem;
            color: var(--text-muted);
            line-height: 1;
            font-weight: 600;
        }

        .vertical-range {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 14px;
            height: 60px;
            accent-color: var(--accent-purple);
            cursor: pointer;
        }

        .btn-reset-eq {
            background: #2b2b2b;
            color: var(--text-muted);
            border: 1px solid #3d3d3d;
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-reset-eq:hover {
            background: var(--accent-purple);
            color: #000;
            border-color: var(--accent-purple);
        }

        /* Кнопки и горизонтальный ползунок времени */
        .controls-row {

            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            border-top: 1px solid #2a2a2a;
            padding-top: 18px;

            color: var(--text-main);
            border: 1px solid #3d3d3d;
            width: 42px;
            height: 42px;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
            transition: all 0.2s;

            background: #383838;
            border-color: var(--accent-purple);

            width: 52px;
            height: 52px;
            font-size: 1.2rem;
            font-weight: bold;

            align-items: center;
            gap: 10px;

            accent-color: var(--accent-purple);
            cursor: pointer;
            height: 5px;

            gap: 24px;

        }

            border-radius: 4px;

    let currentIndex = 0;
    let isPlaying = false;
    let lyricLines = [];
    const localBlobs = {};
    const cachedCovers = {};

    let audioCtx = null;
    let sourceNode = null;
    let bassFilter = null;
    let midFilter = null;
    let trebleFilter = null;
    let gainNode = null;
    let analyserNode = null;

    const audio = document.getElementById('audioElement');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const seekBar = document.getElementById('seekBar');
    const volumeBar = document.getElementById('volumeBar');
    const bassBar = document.getElementById('bassBar');
    const midBar = document.getElementById('midBar');
    const trebleBar = document.getElementById('trebleBar');
    const resetEqBtn = document.getElementById('resetEqBtn');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const currentTitle = document.getElementById('currentTitle');
    const currentGenre = document.getElementById('currentGenre');
    const lyricsBox = document.getElementById('lyricsBox');
    const tracklistEl = document.getElementById('tracklist');
    const badgeEl = document.getElementById('audioModeBadge');
    const visualizer = document.getElementById('visualizer');
    const coverArtContainer = document.getElementById('coverArtContainer');
    const localFileInput = document.getElementById('localFileInput');

    const defaultCoverHTML = `
        <div class="cover-placeholder">
            <span>💿</span>
            Обложка трека
        </div>
    `;

    // Создаем 26 столбиков для плавной волны
    const bars = [];
    for (let i = 0; i < 26; i++) {
        const b = document.createElement('div');
        b.className = 'bar';
        visualizer.appendChild(b);
        bars.push(b);
    }

    function initAudioContext() {
        if (audioCtx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        sourceNode = audioCtx.createMediaElementSource(audio);

        bassFilter = audioCtx.createBiquadFilter();
        bassFilter.type = 'lowshelf';
        bassFilter.frequency.setValueAtTime(250, audioCtx.currentTime);
        bassFilter.gain.setValueAtTime(parseFloat(bassBar.value), audioCtx.currentTime);

        midFilter = audioCtx.createBiquadFilter();
        midFilter.type = 'peaking';
        midFilter.frequency.setValueAtTime(1500, audioCtx.currentTime);
        midFilter.Q.setValueAtTime(1.0, audioCtx.currentTime);
        midFilter.gain.setValueAtTime(parseFloat(midBar.value), audioCtx.currentTime);

        trebleFilter = audioCtx.createBiquadFilter();
        trebleFilter.type = 'highshelf';
        trebleFilter.frequency.setValueAtTime(4000, audioCtx.currentTime);
        trebleFilter.gain.setValueAtTime(parseFloat(trebleBar.value), audioCtx.currentTime);

        gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(volumeBar.value / 100, audioCtx.currentTime);

        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 128;
        analyserNode.smoothingTimeConstant = 0.8;

        sourceNode.connect(bassFilter);
        bassFilter.connect(midFilter);
        midFilter.connect(trebleFilter);
        trebleFilter.connect(gainNode);
        gainNode.connect(analyserNode);
        analyserNode.connect(audioCtx.destination);
    }

    function formatTime(sec) {
        if (!sec || isNaN(sec)) return "00:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function renderPlaylist() {
        tracklistEl.innerHTML = '';
        tracks.forEach((t, idx) => {
            const item = document.createElement('div');
            item.className = 'track-item' + (idx === currentIndex ? ' active' : '');
            item.innerHTML = `
                <div class="track-left">
                    <div class="track-num">${idx === currentIndex && isPlaying ? '&#9654;' : '0' + (idx + 1)}</div>
                    <div>
                        <div class="track-name">${t.title}</div>
                        <div class="track-meta">${t.genre}</div>
                    </div>
                </div>
                <div class="track-bpm">${t.bpm} BPM</div>
            `;
            item.onclick = () => {
                if (currentIndex === idx) {
                    togglePlay();
                } else {
                    loadTrack(idx, true);
                }
            };
            tracklistEl.appendChild(item);
        });
    }

    function setupLyrics(rawText) {
        lyricsBox.innerHTML = '';
        lyricLines = [];
        const lines = rawText.split('\n');
        
        lines.forEach(line => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            if (line.trim().startsWith('[') && line.trim().endsWith(']')) {
                div.classList.add('section-header');
            }
            div.textContent = line === '' ? '\u00A0' : line;
            lyricsBox.appendChild(div);
            lyricLines.push(div);
        });
    }

    function extractCoverFromTag(tag, baseName) {
        const picture = tag.tags && tag.tags.picture;
        if (picture) {
            let base64String = "";
            for (let i = 0; i < picture.data.length; i++) {
                base64String += String.fromCharCode(picture.data[i]);
            }
            const base64 = window.btoa(base64String);
            const imgUrl = `data:${picture.format};base64,${base64}`;
            cachedCovers[baseName] = imgUrl;
            if (tracks[currentIndex].baseName === baseName) {
                coverArtContainer.innerHTML = `<img src="${imgUrl}" alt="Обложка трека">`;
            }
        }
    }

    function updateCoverArt(track) {
        if (cachedCovers[track.baseName]) {
            coverArtContainer.innerHTML = `<img src="${cachedCovers[track.baseName]}" alt="Обложка трека">`;
            return;
        }
        coverArtContainer.innerHTML = defaultCoverHTML;

        if (window.jsmediatags && window.location.protocol !== 'file:') {
            try {
                const fullUrl = new URL(track.audioSrc, window.location.href).href;
                window.jsmediatags.read(fullUrl, {
                    onSuccess: function(tag) {
                        extractCoverFromTag(tag, track.baseName);
                    },
                    onError: function() {}
                });
            } catch (e) {}
        }
    }

    localFileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
            const lowerName = file.name.toLowerCase();
            tracks.forEach(t => {
                if (lowerName.includes(t.baseName)) {
                    localBlobs[t.baseName] = URL.createObjectURL(file);
                    if (window.jsmediatags) {
                        window.jsmediatags.read(file, {
                            onSuccess: function(tag) {
                                extractCoverFromTag(tag, t.baseName);
                            },
                            onError: function() {}
                        });
                    }
                }
            });
        });
        loadTrack(currentIndex, isPlaying);
    });

    function loadTrack(index, autoPlay = false) {
        currentIndex = index;
        const t = tracks[currentIndex];

        currentTitle.textContent = t.title;
        currentGenre.textContent = t.genre;
        
        setupLyrics(t.lyrics);
        updateCoverArt(t);

        audio.src = localBlobs[t.baseName] || t.audioSrc;
        audio.load();

        seekBar.value = 0;
        currentTimeEl.textContent = "00:00";
        totalTimeEl.textContent = "--:--";

        badgeEl.classList.remove('error');
        badgeEl.textContent = "Готов к воспроизведению";

        renderPlaylist();

        if (autoPlay) {
            playCurrent();
        }
    }

    function playCurrent() {
        initAudioContext();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        isPlaying = true;
        playBtn.innerHTML = '&#10074;&#10074;';
        renderPlaylist();

        audio.play().then(() => {
            badgeEl.classList.remove('error');
            badgeEl.textContent = "Играет: " + tracks[currentIndex].title;
        }).catch((err) => {
            isPlaying = false;
            playBtn.innerHTML = '&#9654;';
            badgeEl.classList.add('error');
            badgeEl.textContent = "Нажмите Play или выберите MP3 файл";
            renderPlaylist();
        });
    }

    function pauseCurrent() {
        isPlaying = false;
        playBtn.innerHTML = '&#9654;';
        audio.pause();
        badgeEl.textContent = "На паузе";
        renderPlaylist();
    }

    function togglePlay() {
        if (isPlaying) {
            pauseCurrent();
        } else {
            playCurrent();
        }
    }

    audio.addEventListener('error', () => {
        isPlaying = false;
        playBtn.innerHTML = '&#9654;';
        badgeEl.classList.add('error');
        badgeEl.textContent = `Файл не найден в корне`;
        renderPlaylist();
    });

    audio.addEventListener('loadedmetadata', () => {
        totalTimeEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            currentTimeEl.textContent = formatTime(audio.currentTime);
            seekBar.value = (audio.currentTime / audio.duration) * 100;
        }
    });

    audio.addEventListener('ended', () => {
        nextBtn.click();
    });

    seekBar.addEventListener('input', () => {
        if (audio.duration) {
            audio.currentTime = (seekBar.value / 100) * audio.duration;
        }
    });

    volumeBar.addEventListener('input', () => {
        const val = volumeBar.value / 100;
        if (gainNode && audioCtx) {
            gainNode.gain.setValueAtTime(val, audioCtx.currentTime);
        } else {
            audio.volume = val;
        }
    });

    bassBar.addEventListener('input', () => {
        if (bassFilter && audioCtx) {
            bassFilter.gain.setValueAtTime(parseFloat(bassBar.value), audioCtx.currentTime);
        }
    });

    midBar.addEventListener('input', () => {
        if (midFilter && audioCtx) {
            midFilter.gain.setValueAtTime(parseFloat(midBar.value), audioCtx.currentTime);
        }
    });

    trebleBar.addEventListener('input', () => {
        if (trebleFilter && audioCtx) {
            trebleFilter.gain.setValueAtTime(parseFloat(trebleBar.value), audioCtx.currentTime);
        }
    });

    resetEqBtn.onclick = () => {
        bassBar.value = 0;
        midBar.value = 0;
        trebleBar.value = 0;
        if (audioCtx) {
            if (bassFilter) bassFilter.gain.setValueAtTime(0, audioCtx.currentTime);
            if (midFilter) midFilter.gain.setValueAtTime(0, audioCtx.currentTime);
            if (trebleFilter) trebleFilter.gain.setValueAtTime(0, audioCtx.currentTime);
        }
    };

    const dataArray = new Uint8Array(28);

    setInterval(() => {
        if (isPlaying && !audio.paused && analyserNode) {
            analyserNode.getByteFrequencyData(dataArray);

            bars.forEach((b, idx) => {
                const val = dataArray[idx + 1] || 0;
                const h = Math.max(8, (val / 255) * 105);
                b.style.height = Math.min(h, 100) + 'px';
            });
        } else {
            bars.forEach(b => {
                b.style.height = '8px';
            });
        }
    }, 50);

    playBtn.onclick = togglePlay;
    prevBtn.onclick = () => {
        const nextIdx = (currentIndex - 1 + tracks.length) % tracks.length;
        loadTrack(nextIdx, isPlaying);
    };
    nextBtn.onclick = () => {
        const nextIdx = (currentIndex + 1) % tracks.length;
        loadTrack(nextIdx, isPlaying);
    };

    audio.volume = 0.85;
    renderPlaylist();
    loadTrack(0, false);
</script>
